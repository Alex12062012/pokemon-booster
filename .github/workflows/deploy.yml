name: Mise en ligne

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1' # chaque lundi : cotes rafraîchies
  workflow_dispatch:
    inputs:
      refresh:
        description: 'Rafraîchir les cotes'
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Préparer les cartes et les cotes
        run: node scripts/build-data.mjs
        env:
          REFRESH: ${{ (github.event_name == 'schedule' || inputs.refresh) && '1' || '0' }}
          POKEMONTCG_API_KEY: ${{ secrets.POKEMONTCG_API_KEY }}
      - name: Enregistrer les nouvelles cotes dans le dépôt
        run: |
          git add -f public/cards.json; [ -f public/stats.json ] && git add -f public/stats.json
          if git diff --cached --quiet; then echo "Cotes inchangées"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Cotes Cardmarket mises à jour [skip ci]"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
